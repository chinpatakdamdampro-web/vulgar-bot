name: Build PvPBot Codex 1.21.1

on:
  push:
    branches: [ fix-bot-combat-behavior-h9tgtr, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build mod
        working-directory: pvpbot
        run: gradle build --no-daemon --no-build-cache

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: pvpbot-1.21.1-${{ github.sha }}
          path: pvpbot/build/libs/*.jar
          if-no-files-found: error
